name: discovery

# Evidence-gathering run: real CPU inference of both candidate models on Windows x64.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/ci/discovery.py"
      - ".github/workflows/discovery.yml"

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  llama:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Resolve latest llama.cpp Windows CPU build
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo ggml-org/llama.cpp --json tagName,assets | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { $rel.assets | ForEach-Object { $_.name }; throw "no win-cpu-x64 asset" }
          "tag=$($rel.tagName)" >> $env:GITHUB_OUTPUT
          gh release download $rel.tagName --repo ggml-org/llama.cpp --pattern $asset.name --dir dl
          New-Item -ItemType Directory llama | Out-Null
          Expand-Archive "dl/$($asset.name)" -DestinationPath llama
          $h = (Get-FileHash "dl/$($asset.name)" -Algorithm SHA256).Hash.ToLower()
          @{ tag = $rel.tagName; asset = $asset.name; sha256 = $h;
             files = (Get-ChildItem llama -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path llama).Path.Length + 1) }) } |
            ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 llama-info.json
          Get-Content llama-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: llama
          path: |
            llama
            llama-info.json

  smoke:
    needs: llama
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        candidate: [qwen35-9b-q6k, qwen3-14b-q5km]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "huggingface_hub>=0.25" psutil
      - uses: actions/download-artifact@v4
        with:
          name: llama
          path: llamapkg
      - name: Host facts
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List | Out-File -Encoding utf8 out/host-${{ matrix.candidate }}.txt
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize | Out-File -Append -Encoding utf8 out/host-${{ matrix.candidate }}.txt
          (Get-CimInstance Win32_OperatingSystem).Caption + " " + (Get-CimInstance Win32_OperatingSystem).Version | Out-File -Append -Encoding utf8 out/host-${{ matrix.candidate }}.txt
          Get-Content out/host-${{ matrix.candidate }}.txt
          $c = (Get-PSDrive C).Free; $d = 0; if (Get-PSDrive D -ErrorAction SilentlyContinue) { $d = (Get-PSDrive D).Free }
          if ($d -gt $c) { "WORK=D:\work" >> $env:GITHUB_ENV } else { "WORK=C:\work" >> $env:GITHUB_ENV }
      - name: Smoke translation
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python tools/ci/discovery.py --candidate ${{ matrix.candidate }} --llama-dir llamapkg/llama --work $env:WORK --out out
          Get-Content out/${{ matrix.candidate }}.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.candidate }}
          path: out

  publish:
    needs: [llama, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Commit report to ci-reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dest="discovery/run-${{ github.run_id }}"
          git clone --depth 1 --branch ci-reports "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" rep \
            || { git init rep; git -C rep checkout -b ci-reports; git -C rep remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"; }
          mkdir -p "rep/$dest"
          cp art/llama/llama-info.json "rep/$dest/" || true
          for d in art/report-*; do cp -r "$d"/* "rep/$dest/" || true; done
          cd rep
          git config user.name "arabica-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "discovery report ${{ github.run_id }} (llama.cpp ${{ needs.llama.outputs.tag }})" || exit 0
          git push origin ci-reports
