name: discovery

# Evidence-gathering run: real CPU inference of both candidate models on Windows x64.
# All logs are committed to the `ci-reports` branch (job logs are not readable from the dev sandbox).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/ci/**"
      - ".github/workflows/discovery.yml"

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: true

jobs:
  llama:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch llama.cpp Windows CPU build
        id: rel
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory logs -Force | Out-Null
          python tools/ci/fetch_llama.py --dest llama --info llama-info.json 2>&1 | Tee-Object -FilePath logs/fetch_llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-ChildItem llama -Recurse -Filter llama-server.exe | Select-Object -First 1).FullName --version 2>&1 | Tee-Object -FilePath logs/llama-version.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: llama
          path: |
            llama
            llama-info.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-llama
          path: |
            logs
            llama-info.json

  smoke:
    needs: llama
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        candidate: [qwen35-9b-q6k, qwen3-14b-q5km]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "huggingface_hub>=0.25" psutil
      - uses: actions/download-artifact@v4
        with:
          name: llama
          path: llamapkg
      - name: Host facts
        shell: pwsh
        run: |
          New-Item -ItemType Directory out -Force | Out-Null
          $f = "out/host-${{ matrix.candidate }}.txt"
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List | Out-File -Encoding utf8 $f
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize | Out-File -Append -Encoding utf8 $f
          $os = Get-CimInstance Win32_OperatingSystem; "$($os.Caption) $($os.Version)" | Out-File -Append -Encoding utf8 $f
          Get-Content $f
          $c = (Get-PSDrive C).Free; $d = 0; if (Get-PSDrive D -ErrorAction SilentlyContinue) { $d = (Get-PSDrive D).Free }
          if ($d -gt $c) { "WORK=D:\work" >> $env:GITHUB_ENV } else { "WORK=C:\work" >> $env:GITHUB_ENV }
      - name: Smoke translation
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python tools/ci/discovery.py --candidate ${{ matrix.candidate }} --llama-dir llamapkg/llama --work $env:WORK --out out 2>&1 | Tee-Object -FilePath out/discovery-${{ matrix.candidate }}.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.candidate }}
          path: out

  publish:
    needs: [llama, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: art
      - name: Commit report to ci-reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          dest="discovery/run-${{ github.run_id }}-${{ github.run_attempt }}"
          if git ls-remote --exit-code --heads "$remote" ci-reports >/dev/null; then
            git clone --depth 1 --branch ci-reports "$remote" rep
          else
            git init -q rep; git -C rep checkout -q -b ci-reports; git -C rep remote add origin "$remote"
          fi
          mkdir -p "rep/$dest"
          cp -r art/. "rep/$dest/" || true
          echo "llama=${{ needs.llama.result }} smoke=${{ needs.smoke.result }} sha=${{ github.sha }}" > "rep/$dest/RESULT.txt"
          cd rep
          git config user.name "arabica-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "discovery ${{ github.run_id }}" || exit 0
          git push -q origin ci-reports
