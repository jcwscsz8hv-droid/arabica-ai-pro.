name: tests

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 > /dev/null
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v 2>&1 | tee test-linux.log
      - run: python tools/eval/build_cases.py --check
      - if: always()
        run: python tools/ci/annotate.py tests-linux test-linux.log

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: C:\w
    steps:
      # Repository name ends with "." which Windows cannot use as a folder; clone into C:\w.
      - name: Checkout (dot-safe)
        shell: pwsh
        working-directory: C:\
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" C:\w
          git -C C:\w checkout ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit + integration + GUI tests (Windows)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-windows.log
          $code = $LASTEXITCODE
          python tools/ci/annotate.py tests-windows test-windows.log
          exit $code
